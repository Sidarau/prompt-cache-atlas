services:
  - type: web
    name: prompt-cache-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 60 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: KIE_AI_API_KEY
        sync: false
    disk:
      name: cache-data
      mountPath: /opt/render/project/src
      sizeGB: 1
